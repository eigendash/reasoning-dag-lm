[project]
name = "dot-lm"
version = "0.1.0"
description = "Typed reasoning-DAG traces with an online validator, and a small MLX language model trained on them"
requires-python = ">=3.10"
dependencies = ["mlx>=0.22", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
